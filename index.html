<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fishy</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>"
    />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div class="hud-group">
        <span id="hud-round"></span>
        <span id="hud-timer" class="hud-big"></span>
      </div>
      <div class="hud-group hud-right">
        <span id="hud-money" class="hud-big"></span>
        <span id="hud-earned"></span>
      </div>
    </div>

    <p id="round-hint" class="round-hint" hidden>Move your net over the fish. It catches them on its own.</p>

    <section id="hub" hidden>
      <header class="hub-bar">
        <div class="hub-player">
          <span id="hub-name" class="hub-name"></span>
          <span id="hub-round" class="hub-muted"></span>
        </div>
        <span id="hub-money" class="hub-money"></span>
        <p id="hub-hint" class="hub-hint hub-muted"></p>
        <div id="hub-save" class="hub-save"></div>
        <button id="start-button" type="button" class="primary-button">Start Round</button>
      </header>
      <div id="hub-tree" class="hub-tree"></div>
    </section>

    <section id="summary-panel" class="panel" hidden>
      <h2 id="summary-title"></h2>
      <dl>
        <dt>Fish caught</dt>
        <dd id="summary-fish"></dd>
        <dt>Earned</dt>
        <dd id="summary-earned"></dd>
        <dt>Bank</dt>
        <dd id="summary-bank"></dd>
      </dl>
      <button id="continue-button" type="button">Continue</button>
    </section>

    <section id="end-panel" class="panel end-panel" hidden>
      <h1>Thank you for playing!</h1>
      <p id="end-message"></p>
      <dl>
        <dt>Rounds played</dt>
        <dd id="end-rounds"></dd>
        <dt>Fish caught</dt>
        <dd id="end-fish"></dd>
        <dt>Best round</dt>
        <dd id="end-best"></dd>
        <dt>Time at sea</dt>
        <dd id="end-time"></dd>
      </dl>
      <button id="play-again-button" type="button">Play Again</button>
      <p class="end-note">Play Again starts over from round 1. Your name is kept.</p>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
